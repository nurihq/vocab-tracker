<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>monogenesis</title>
  <script>
    // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
    var l = window.location;
    var isSubdir = l.pathname.indexOf('/vocab-tracker') === 0;
    var repoPrefix = isSubdir ? '/vocab-tracker' : '';
    var cleanPath = l.pathname.slice(repoPrefix.length);

    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      repoPrefix + '/?/' + encodeURIComponent(cleanPath + l.search) + l.hash
    );
  </script>
</head>
<body></body>
</html>
